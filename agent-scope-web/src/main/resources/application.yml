# ========================
# 数据源配置（Druid 连接池）
# ========================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource          # 使用 Druid 连接池
    url: jdbc:mysql://127.0.0.1:3306/agent_scope?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # MySQL 连接地址；useUnicode+characterEncoding 保证中文不乱码；serverTimezone 指定时区；useSSL=false 关闭 SSL 验证
    username: root                                         # 数据库用户名
    password: chenlei@2025                                 # 数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver            # MySQL 8.x JDBC 驱动类
    readonly:
      type: com.alibaba.druid.pool.DruidDataSource
      url: jdbc:mysql://127.0.0.1:3306/upay_server_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: chenlei@2025
      driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5                                      # 初始化连接数
      min-idle: 5                                          # 最小空闲连接数
      max-active: 20                                       # 最大活跃连接数
      max-wait: 60000                                      # 获取连接最大等待时间（毫秒）
      time-between-eviction-runs-millis: 60000             # 空闲连接检测间隔（毫秒）
      min-evictable-idle-time-millis: 300000               # 连接最小空闲时间（毫秒），超过后可被回收
      validation-query: SELECT 1                           # 连接有效性检测 SQL
      test-while-idle: true                                # 空闲时检测连接有效性
      test-on-borrow: false                                # 借出连接时不检测（提升性能）
      test-on-return: false                                # 归还连接时不检测（提升性能）
      pool-prepared-statements: true                       # 开启 PSCache（MySQL 建议开启）
      max-pool-prepared-statement-per-connection-size: 20  # 每个连接的 PSCache 大小
      filters: stat,wall                                   # 开启监控统计（stat）和防 SQL 注入（wall）
      stat-view-servlet:
        enabled: true                                      # 启用 Druid 监控页面
        url-pattern: /druid/*                              # 监控页面访问路径
        login-username: admin                              # 监控页面登录用户名
        login-password: admin123                           # 监控页面登录密码
        allow:                                             # 允许访问的 IP（空表示不限制）
      web-stat-filter:
        enabled: true                                      # 启用 Web 关联监控
        url-pattern: /*                                    # 过滤所有请求
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"  # 排除静态资源和 Druid 自身路径

# ========================
# MyBatis-Plus 配置
# ========================
mybatis-plus:
  configuration:
    # SQL 日志由自定义 SqlLogInterceptor 拦截器打印完整 SQL，无需 StdOutImpl
    map-underscore-to-camel-case: true                     # 开启下划线字段自动映射为驼峰命名（如 user_name -> userName）
  global-config:
    db-config:
      logic-delete-field: delFlag   # 逻辑删除标志字段名
      logic-delete-value: 1         # 已删除的标志值
      logic-not-delete-value: 0     # 未删除的标志值

# ========================
# 日志配置（企业级）
# 详细规则见 logback-spring.xml：
#   - 异步 Appender 提升吞吐
#   - 按天 + 按大小滚动，归档 gzip 压缩
#   - ERROR / WARN 独立日志文件
#   - dev / prod 环境差异化级别
# ========================
logging:
  config: classpath:logback-spring.xml                    # 指定 Logback 配置文件

# ========================
# AgentScope Studio 可视化面板
# enabled: true  -> 启用（需先运行 as_studio）
# enabled: false -> 关闭（生产环境建议关闭）
# ========================
agentscope:
  studio:
    enabled: false                        # 是否启用 AgentScope Studio 可视化面板（启用前需先运行 as_studio）
    url: http://localhost:3000           # AgentScope Studio 服务地址
    project: agent-scope-project        # 当前项目在 Studio 中注册的项目名称

# Agent 工具配置（由 agent-scope-tool-spring-boot-starter 自动装配）
agent:
  tool:
    enabled: true                   # 是否启用 Agent 工具模块（true=开启，false=关闭）
    execution-timeout-seconds: 10   # 单次工具调用的最大执行超时时间（单位：秒）
    default-enabled:                # 默认启用的内置工具列表（工具名需与 @AgentToolDef 中 name 一致）
      - get_weather                 # 天气查询工具
      - calculate                   # 数学计算工具
      - web_search                  # 网页搜索工具
    builtin:                        # 内置工具全局开关
      enabled: true                 # true=加载所有内置工具；false=禁用内置工具（可仅使用自定义工具）

# ========================
# Agent 记忆管理配置
# ========================
  memory:
    default-mode: SUMMARY  # 全局默认记忆模式（FULL=全量不压缩 / WINDOW=纯滑动丢弃 / SUMMARY=摘要+滑动）
    max-turns: 5          # 全局默认记忆窗口上限（轮数），FULL 模式下忽略此项

# ========================
# SQL Agent 配置（由 agent-scope-sql-spring-boot-starter 自动装配）
# 启用后注册 list_datasources / get_table_schema / query_database 三个工具，
# 走 HITL 审批 + SqlGuardEngine + Caffeine token 链路。
# ========================
  sql:
    enabled: true                                            # 是否启用 SQL Agent（false 时本 starter 完全惰性，零额外 Bean）
    default-row-limit: 500                                   # 强制 LIMIT 上限：未指定或超过该值的查询会被 SqlGuardEngine 自动改写
    explain-row-threshold: 100000                            # EXPLAIN 估算行数告警阈值；超出会在 warnings 中提示用户
    execution-timeout-seconds: 15                            # 单次 SELECT/EXPLAIN 的最大执行时长（秒）
    token-ttl-seconds: 300                                   # 审批 token 有效期；超时未确认会被 Caffeine 自动驱逐
    crypto-key: ${SQL_DS_CRYPTO_KEY:change-me-32-bytes}      # AES-GCM 主密钥；建议通过环境变量注入，禁止以明文写入生产配置

# ========================
# RAG 模块自动配置属性（由 agent-scope-rag-spring-boot-starter 自动装配）
# 支持动态切换向量库类型（IN_MEMORY/MILVUS/ELASTICSEARCH）及自定义连接细节
# ========================
  rag:
    enabled: true                                            # 是否启用 RAG Starter 模块。控制配置类及核心 RAG 基础设施 Bean 是否自动注入
    store-type: ELASTICSEARCH                                    # 向量数据库介质类型。可选值：IN_MEMORY（本地内存库）、MILVUS（企业级高可用）、ELASTICSEARCH（基于 ES 索引）、QDRANT
    default-row-limit: 3                                     # 默认单次检索召回的最大文本分片数量（Top-K）
    default-score-threshold: 0.3                             # 默认检索相似度得分最低过滤阈值，取值范围 0.0 ~ 1.0，仅召回大于或等于该分数的片段
    chunk-size: 512                                          # 文档切片分割的最大字数/字符尺寸
    in-memory:
      persist-path: ./data/vdb/local                         # 本地持久化缓存文件夹路径。为空时不进行持久化落盘，重启后内存数据丢失
    milvus:
      uri: http://localhost:19530                            # Milvus 服务器连接地址（格式：http://ip:port）
      collection-name: agent_knowledge                       # 主集合名称前缀。实际的 Collection Name 会加上知识库 ID 进行隔离
      token: ""                                              # 连接验证 Token
    elasticsearch:
      uris:
        - http://localhost:9200                              # ES 服务器集群节点地址
      index-name: agent_knowledge                            # 主索引名称前缀。实际的 Index Name 会加上知识库 ID 进行隔离
      username: ""                                           # 连接用户名
      password: ""                                           # 连接密码